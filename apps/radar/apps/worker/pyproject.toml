[project]
name = "rasathane-worker"
version = "0.1.0"
description = "Rasathane scheduler & background jobs"
requires-python = ">=3.12,<3.13"
dependencies = [
    "apscheduler>=3.10",
    "pydantic>=2.9",
    "structlog>=24.4",
    "typer>=0.13",
    "rasathane-store",
    "rasathane-ingestion",
    "rasathane-llm",
]

[project.scripts]
pulse = "worker.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/worker"]

[tool.uv.sources]
rasathane-store = { workspace = true }
rasathane-ingestion = { workspace = true }
rasathane-llm = { workspace = true }
