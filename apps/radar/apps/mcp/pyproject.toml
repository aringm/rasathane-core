[project]
name = "rasathane-mcp"
version = "0.1.0"
description = "Rasathane MCP server — exposes ingest/search/brief tools to Claude Desktop"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mcp>=1.0",
    "structlog>=24.4",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "pypdf>=5.0",
    "rasathane-store",
    "rasathane-ingestion",
    "rasathane-llm",
]

[project.scripts]
rasathane-mcp = "rasathane_mcp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rasathane_mcp"]

[tool.uv.sources]
rasathane-store = { workspace = true }
rasathane-ingestion = { workspace = true }
rasathane-llm = { workspace = true }
