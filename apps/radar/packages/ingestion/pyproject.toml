[project]
name = "rasathane-ingestion"
version = "0.1.0"
description = "Source ingesters for Rasathane: RSS, Twitter, Reddit, ArXiv, YouTube, GitHub"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.9",
    "structlog>=24.4",
    "feedparser>=6.0",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "yt-dlp>=2024.10",
    "faster-whisper>=1.1",
    "mcp>=1.0",
    "redis>=5.0",
    "rasathane-store",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ingestion"]

[tool.uv.sources]
rasathane-store = { workspace = true }
