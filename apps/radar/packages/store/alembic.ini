# Alembic configuration for rasathane-store.
# DATABASE_URL is read from environment in env.py — sqlalchemy.url here
# is a placeholder used only when env.py decides to fall back.

[alembic]
# %(here)s is interpolated to the directory containing this file, so
# alembic works regardless of caller's cwd.
script_location = %(here)s/migrations
prepend_sys_path = %(here)s/src
version_path_separator = os
sqlalchemy.url = postgresql+psycopg2://rasathane:rasathane@localhost:5435/rasathane

[post_write_hooks]
hooks = ruff_format
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
