[project]
name = "rasathane-worker-runtime"
version = "0.5.0"
requires-python = ">=3.12,<3.13"
license = "AGPL-3.0-or-later"
dependencies = [
  "torch==2.8.0+cpu",
  "transformers==4.57.6",
  "faster-whisper==1.2.1",
  # PyAV 19 metadata_errors'i kaldırdı; faster-whisper 1.2.1 bu argümanı kullanır.
  "av==18.0.0",
  "pydantic==2.12.5",
  "httpx==0.28.1",
]

[dependency-groups]
dev = ["pyinstaller==6.20.0"]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
